name: Run analysis

on:
  workflow_dispatch:
    inputs:
      commands:
        description: 'Borsagator composed commands (overrides vars.COMMANDS)'
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run commands
        run: ${{ inputs.commands || vars.COMMANDS }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
